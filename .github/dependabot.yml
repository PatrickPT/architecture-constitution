# Keeps the workflow actions, which are pinned to commit SHAs, current: Dependabot opens a PR when a pinned
# action has a new release, and moves the SHA and its version comment together. Nothing else here has
# dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
