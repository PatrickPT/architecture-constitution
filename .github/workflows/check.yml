# PR checks. No secrets. Each step runs one target of the Makefile, which holds the commands.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Consistency (references, ranges, counts, links)
        run: make consistency
      - name: Tests (standard library only)
        run: make test
