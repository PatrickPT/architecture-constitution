name: The skill went wrong
description: A constitution that didn't fit, or a review that missed or invented a finding.
body:
  - type: markdown
    attributes:
      value: |
        Please describe it with an invented repository: no real code, private paths, names or credentials.
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [write, review]
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What the skill did
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and which article or principle says so
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness, model and version
      placeholder: Claude Code 2.1.0, claude-sonnet-5-5
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not pasted real code, private paths, names or credentials.
          required: true
